services:
  proxy:
    build: ./proxy
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "file:/data/app.db"
      UPLOAD_DIR: /uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - db-data:/data
      - uploads:/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
