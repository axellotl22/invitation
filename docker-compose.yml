services:
  proxy:
    build: ./proxy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${APP_PORT:-8080}:80"
      - "${APP_TLS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: "file:/data/app.db"
      UPLOAD_DIR: /uploads
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - db-data:/data
      - uploads:/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
