services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: "file:/data/app.db"
      UPLOAD_DIR: /uploads
      # Same-origin behind the nginx proxy, so CORS only matters for local dev
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - db-data:/data
      - uploads:/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
  uploads:
